name: CareHub checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: php tests/server-validation.php
      - name: Test shared saving with synthetic records
        run: PHP_BINARY="$(command -v php)" node tests/server.integration.mjs
  helper-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test access requests with WordPress and disposable helper accounts
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e 'CREATE DATABASE carehub_access_test'
          curl --fail --silent --show-error --location --retry 2 https://wordpress.org/latest.tar.gz -o "$RUNNER_TEMP/carehub-wordpress.tar.gz"
          tar -xzf "$RUNNER_TEMP/carehub-wordpress.tar.gz" -C "$RUNNER_TEMP"
          node tests/staff-access.integration.mjs
